[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
filterwarnings =
    # jutai_ble_lights depends on the `bluetooth` component, so setting up its config
    # entry also sets up the real `bluetooth` integration. That integration's
    # BleakSlotManager unconditionally tries (once per process) to reach the real
    # system D-Bus socket via bleak_retry_connector, which it already catches and
    # handles gracefully. pytest-homeassistant-custom-component's socket guard still
    # emits this warning on the blocked attempt itself before the caller's except
    # runs. This is expected collateral of the socket block being active (desired),
    # not a defect in tests/conftest.py's fixtures -- mock_bluetooth (used by mock_ble)
    # already covers the seams pytest-homeassistant-custom-component exposes for this.
    ignore:A test tried to use socket.socket.connect\(\) with host "None":UserWarning
