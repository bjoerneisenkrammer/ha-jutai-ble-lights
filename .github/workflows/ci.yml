name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catch upstream bleak bumps before users hit them on their next HA upgrade.
  schedule:
    - cron: "37 6 * * 1"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # pytest-homeassistant-custom-component requires >=3.14. On an older
          # Python, pip backtracks to an outdated release of it and the suite
          # would quietly run against the wrong Home Assistant.
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # pip does not install Home Assistant's per-integration requirements;
      # importing light.py needs the bluetooth stack. See the script's docstring.
      - name: Install Home Assistant's bluetooth stack
        run: python scripts/ha_test_deps.py

      # Printed so a failing run shows what it ran against without digging.
      - name: Show versions under test
        run: |
          python -c "from importlib.metadata import version; print('homeassistant', version('homeassistant')); print('bleak', version('bleak'))"

      - name: Run tests
        run: pytest tests/ -v
